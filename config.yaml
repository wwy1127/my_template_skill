skill:
  name: "{{Universal AI Skill Framework}}"
  version: "{{v1.0}}"

llm:
  provider: "openai"              # openai | anthropic | ollama
  model: "gpt-5"
  temperature: 0.3
  max_tokens: 12000
  timeout_seconds: 120

permissions:
  code_generation: true
  file_modification: true
  internet_access: optional
  deployment: optional

vector_store:
  provider: "chromadb"            # chromadb | faiss | pinecone
  collection_name: "{{SKILL_NAME}}_docs"
  persist_path: "vector_store/"
  embedding_model: "text-embedding-3-small"
  retrieval_top_k: 5
  similarity_threshold: 0.75

runtime:
  max_retries: 3
  retry_backoff: "exponential"    # exponential | linear
  log_level: "INFO"               # DEBUG | INFO | WARNING | ERROR

evaluation:
  confidence_threshold: 0.7
  latency_threshold_ms: 30000
  auto_fix: false

output:
  format: markdown
  include_validation: true
  save_outputs: true
